<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-{{nonce}}';"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        padding: 8px;
        font-family: var(--vscode-editor-font-family, monospace);
        color: var(--vscode-editor-foreground, #eaeaea);
        background: var(--vscode-editor-background, #1e1e1e);
      }
      #out {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        min-height: 10rem;
      }
      body.cpm22 #out {
        box-sizing: content-box;
        width: 80ch;
        height: 28.8em;
        min-height: 0;
        overflow: hidden;
        line-height: 1.2;
        white-space: pre;
        word-break: normal;
      }
      .controls {
        margin-top: 8px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #input {
        flex: 1 1 auto;
        min-width: 0;
        color: inherit;
        background: transparent;
        border: 1px solid var(--vscode-panel-border, #444);
        padding: 4px 6px;
      }
      button {
        color: inherit;
        background: var(--vscode-button-background, #0e639c);
        border: 0;
        padding: 5px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <pre id="out">{{initialOutput}}</pre>
    <div class="controls">
      <input
        id="input"
        type="text"
        placeholder="Type here"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      />
      <button id="send">Send</button>
    </div>
    <script nonce="{{nonce}}">
      (function () {
        const vscode = acquireVsCodeApi();
        const out = document.getElementById('out');
        const input = document.getElementById('input');
        const send = document.getElementById('send');
        const terminalMode = '{{terminalMode}}';
        const columns = 80;
        const rows = 24;
        const cells = Array(columns * rows).fill(' ');
        let row = 0;
        let column = 0;
        let wrapPending = false;
        let escape = '';

        if (terminalMode === 'cpm22') document.body.classList.add('cpm22');

        function renderScreen() {
          const lines = [];
          for (let y = 0; y < rows; y += 1) {
            lines.push(cells.slice(y * columns, (y + 1) * columns).join(''));
          }
          out.textContent = lines.join('\n');
        }

        function scroll() {
          cells.copyWithin(0, columns);
          cells.fill(' ', (rows - 1) * columns);
          row = rows - 1;
        }

        function lineFeed() {
          wrapPending = false;
          row += 1;
          if (row >= rows) scroll();
        }

        function eraseLine(mode) {
          const start = row * columns;
          if (mode === 1) cells.fill(' ', start, start + column + 1);
          else if (mode === 2) cells.fill(' ', start, start + columns);
          else cells.fill(' ', start + column, start + columns);
        }

        function eraseDisplay(mode) {
          const cursor = row * columns + column;
          if (mode === 1) cells.fill(' ', 0, cursor + 1);
          else if (mode === 2) cells.fill(' ');
          else cells.fill(' ', cursor);
        }

        function applyCsi(sequence) {
          const final = sequence.at(-1);
          const params = sequence
            .slice(2, -1)
            .split(';')
            .map((value) => (value === '' ? 0 : Number(value)));
          const count = Math.max(1, params[0] || 1);
          if (final === 'A') row = Math.max(0, row - count);
          else if (final === 'B') row = Math.min(rows - 1, row + count);
          else if (final === 'C') column = Math.min(columns - 1, column + count);
          else if (final === 'D') column = Math.max(0, column - count);
          else if (final === 'H' || final === 'f') {
            row = Math.min(rows - 1, Math.max(0, (params[0] || 1) - 1));
            column = Math.min(columns - 1, Math.max(0, (params[1] || 1) - 1));
          } else if (final === 'J') eraseDisplay(params[0] || 0);
          else if (final === 'K') eraseLine(params[0] || 0);
          wrapPending = false;
        }

        function applyTerminalText(text) {
          for (const character of text) {
            const code = character.charCodeAt(0);
            if (escape !== '') {
              escape += character;
              if (escape.length === 2 && character !== '[') escape = '';
              else if (/^[A-Za-z]$/.test(character)) {
                applyCsi(escape);
                escape = '';
              } else if (escape.length > 32) escape = '';
              continue;
            }
            if (code === 0x1b) escape = character;
            else if (code === 0x08) {
              column = Math.max(0, column - 1);
              wrapPending = false;
            } else if (code === 0x09) {
              column = Math.min(columns - 1, (Math.floor(column / 8) + 1) * 8);
              wrapPending = false;
            } else if (code === 0x0a) lineFeed();
            else if (code === 0x0d) {
              column = 0;
              wrapPending = false;
            } else if (code >= 0x20 && code !== 0x7f) {
              if (wrapPending) {
                column = 0;
                lineFeed();
              }
              cells[row * columns + column] = character;
              if (column === columns - 1) wrapPending = true;
              else column += 1;
            }
          }
          renderScreen();
        }

        if (terminalMode === 'cpm22') {
          const initial = out.textContent;
          cells.fill(' ');
          applyTerminalText(initial);
        }

        window.addEventListener('message', (event) => {
          const msg = event.data;
          if (msg.type === 'clear') {
            if (terminalMode === 'cpm22') {
              cells.fill(' ');
              row = 0;
              column = 0;
              wrapPending = false;
              escape = '';
              renderScreen();
            } else out.textContent = '';
            return;
          }
          if (msg.type === 'output' && typeof msg.text === 'string') {
            if (terminalMode === 'cpm22') applyTerminalText(msg.text);
            else out.textContent += msg.text;
            window.scrollTo(0, document.body.scrollHeight);
          }
        });

        function sendInput() {
          const text = input.value;
          const payload = text + (terminalMode === 'cpm22' ? '\r' : '\n');
          if (terminalMode !== 'cpm22') out.textContent += payload;
          window.scrollTo(0, document.body.scrollHeight);
          vscode.postMessage({ type: 'input', text: payload });
          input.value = '';
          input.focus();
        }

        send.addEventListener('click', sendInput);
        input.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
            event.preventDefault();
            if (terminalMode === 'cpm22') {
              vscode.postMessage({ type: 'input', text: '\r' });
            } else sendInput();
            return;
          }
          if (terminalMode === 'cpm22' && event.key.startsWith('Arrow')) {
            const suffix = { ArrowUp: 'A', ArrowDown: 'B', ArrowRight: 'C', ArrowLeft: 'D' }[
              event.key
            ];
            if (suffix) {
              event.preventDefault();
              vscode.postMessage({ type: 'input', text: '\u001b[' + suffix });
              return;
            }
          }
          if (terminalMode === 'cpm22' && event.key === 'Backspace') {
            event.preventDefault();
            vscode.postMessage({ type: 'input', text: '\b' });
            return;
          }
          if (terminalMode === 'cpm22' && event.key === 'Delete') {
            event.preventDefault();
            vscode.postMessage({ type: 'input', text: '\u007f' });
            return;
          }
          if (
            terminalMode === 'cpm22' &&
            event.key.length === 1 &&
            !event.altKey &&
            !event.ctrlKey &&
            !event.metaKey
          ) {
            event.preventDefault();
            vscode.postMessage({ type: 'input', text: event.key });
            return;
          }
          if (event.key === 'c' && event.ctrlKey) vscode.postMessage({ type: 'break' });
        });
        input.addEventListener('paste', (event) => {
          if (terminalMode !== 'cpm22') return;
          event.preventDefault();
          const text = event.clipboardData?.getData('text/plain') ?? '';
          if (text !== '') vscode.postMessage({ type: 'input', text });
        });

        input.focus();
      })();
    </script>
  </body>
</html>
