name: Toolchain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Each maintained workspace verifies only when it changes.
# Dependency graph:
#   azm ──────────┬─▶ extension
#                 └─▶ azm-headless
#
# Runtime, Atom, Nucleus, and Z80 Tool Services are immutable external
# dependencies here. Their own repositories verify their source releases.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      azm: ${{ steps.filter.outputs.azm }}
      azm-headless: ${{ steps.filter.outputs.azm-headless }}
      extension: ${{ steps.filter.outputs.extension }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            azm:
              - 'packages/azm/**'
            azm-headless:
              - 'integration/azm-headless/**'
              - 'integration/.eslintrc.json'
            extension:
              - 'apps/debug80-vscode/**'
            infra:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - 'scripts/**'
              - 'docs/specifications/azm-direct-dependency-inventory.json'

  azm:
    needs: changes
    if: needs.changes.outputs.azm == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @jhlagado/azm
      - run: npm run typecheck -w @jhlagado/azm
      - run: npm run lint -w @jhlagado/azm
      - run: npm run format:check -w @jhlagado/azm
      - run: npm run test -w @jhlagado/azm
      - run: npm run package:azm

  source-size:
    needs: changes
    if: >-
      needs.changes.outputs.azm == 'true' ||
      needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm run check:native-lockfile
      - run: npm run check:source-file-sizes:enforce
      - run: npm run check:links:external

  azm-headless:
    needs: changes
    if: >-
      needs.changes.outputs.azm-headless == 'true' ||
      needs.changes.outputs.azm == 'true' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      # Runtime is a pinned Git dependency whose prepare script creates dist.
      - run: npm ci
      - run: npm run build -w @jhlagado/azm
      - run: npm run typecheck -w @jhlagado/azm-headless-integration
      - run: npm run lint -w @jhlagado/azm-headless-integration
      - run: npm run format:check -w @jhlagado/azm-headless-integration
      - run: npm run test -w @jhlagado/azm-headless-integration

  extension:
    needs: changes
    if: >-
      needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.azm == 'true' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # Runtime and Tool Services build dist in prepare; the lockfile fixes
      # all four external packages to reviewed source revisions.
      - run: npm ci
      - run: npm run build -w @jhlagado/azm
      - run: npm run build -w debug80
      - run: npm run check:assembler-selections
      - run: npm run check:azm-dependency-inventory
      - run: npm run check:atom-e2e-fixtures
      - run: npm run check:cpm22-atom-candidates
      - run: npm run typecheck -w debug80
      - run: npm run typecheck:webview -w debug80
      - run: npm run lint -w debug80
      - run: npm run format:check -w debug80
      - run: npm run test -w debug80
      - run: xvfb-run -a npm run test:vscode -w debug80
      - run: npm run package:debug80

  # Single required status; fails if any triggered job failed.
  ci-ok:
    needs: [changes, azm, source-size, azm-headless, extension]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required job reported: $r"; exit 1;;
            esac
          done
