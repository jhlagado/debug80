name: Toolchain CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Each workspace verifies only when it or an upstream dependency changed.
# Dependency graph:
#   azm ──────────┬─▶ extension
#   runtime ──────┼────────────────
#                 └─▶ azm-headless
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      azm: ${{ steps.filter.outputs.azm }}
      runtime: ${{ steps.filter.outputs.runtime }}
      azm-headless: ${{ steps.filter.outputs.azm-headless }}
      extension: ${{ steps.filter.outputs.extension }}
      nucleus: ${{ steps.filter.outputs.nucleus }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            azm:
              - 'packages/azm/**'
            runtime:
              - 'packages/debug80-runtime/**'
            azm-headless:
              - 'integration/azm-headless/**'
              - 'integration/.eslintrc.json'
            extension:
              - 'apps/debug80-vscode/**'
            nucleus:
              - 'packages/nucleus/**'
              - 'packages/atom/**'
              - 'packages/azm/**'
              - 'packages/debug80-runtime/**'
              - 'packages/z80-tool-services/**'
            infra:
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
              - 'scripts/check-source-file-sizes.mjs'
              - 'scripts/source-file-size-allowlist.json'

  azm:
    needs: changes
    if: needs.changes.outputs.azm == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @jhlagado/azm
      - run: npm run typecheck -w @jhlagado/azm
      - run: npm run lint -w @jhlagado/azm
      - run: npm run format:check -w @jhlagado/azm
      - run: npm run test -w @jhlagado/azm
      - run: npm run package:azm

  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true' || needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @jhlagado/debug80-runtime
      - run: npm run typecheck -w @jhlagado/debug80-runtime
      - run: npm run lint -w @jhlagado/debug80-runtime
      - run: npm run format:check -w @jhlagado/debug80-runtime
      - run: npm run test -w @jhlagado/debug80-runtime
      - run: npm run package:runtime

  source-size:
    needs: changes
    if: >-
      needs.changes.outputs.azm == 'true' ||
      needs.changes.outputs.runtime == 'true' ||
      needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - run: npm run check:source-file-sizes:enforce
      - run: npm run check:links:external

  azm-headless:
    needs: changes
    if: >-
      needs.changes.outputs.azm-headless == 'true' ||
      needs.changes.outputs.azm == 'true' ||
      needs.changes.outputs.runtime == 'true' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @jhlagado/azm
      - run: npm run build -w @jhlagado/debug80-runtime
      - run: npm run typecheck -w @jhlagado/azm-headless-integration
      - run: npm run lint -w @jhlagado/azm-headless-integration
      - run: npm run format:check -w @jhlagado/azm-headless-integration
      - run: npm run test -w @jhlagado/azm-headless-integration

  extension:
    needs: changes
    if: >-
      needs.changes.outputs.extension == 'true' ||
      needs.changes.outputs.azm == 'true' ||
      needs.changes.outputs.runtime == 'true' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @jhlagado/azm
      - run: npm run build -w @jhlagado/debug80-runtime
      - run: npm run build -w debug80
      - run: npm run typecheck -w debug80
      - run: npm run typecheck:webview -w debug80
      - run: npm run lint -w debug80
      - run: npm run format:check -w debug80
      - run: npm run test -w debug80
      - run: xvfb-run -a npm run test:vscode -w debug80
      - run: npm run package:debug80

  nucleus:
    needs: changes
    if: >-
      needs.changes.outputs.nucleus == 'true' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @jhlagado/azm
      - run: npm run build -w @jhlagado/debug80-runtime
      - run: npm run build -w @jhlagado/z80-tool-services
      - run: npm run build -w atom-z80
      - run: npm run typecheck -w @jhlagado/nucleus
      - run: npm run test -w @jhlagado/nucleus
      - run: npm run package:nucleus

  # Single required status; fails if any triggered job failed.
  ci-ok:
    needs:
      [
        changes,
        azm,
        runtime,
        source-size,
        azm-headless,
        extension,
        nucleus,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required job reported: $r"; exit 1;;
            esac
          done
